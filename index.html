<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tama Beauty · Gestión</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/styles.css?v=2">
<link rel="stylesheet" href="css/facturas.css?v=2">
</head>
<body>
<!-- ACCESO: crear cuenta (primera vez) o iniciar sesión -->
<section id="auth" hidden>
  <form id="authForm" class="card">
    <img src="assets/logo.png" alt="Tama Beauty" class="logo-big">
    <h2 id="authTitle"></h2>
    <label id="bizRow">Nombre del emprendimiento<input id="biz" value="Tama Beauty"></label>
    <label>Usuario<input id="u" required autocomplete="username"></label>
    <label>Clave<input id="pw" type="password" required autocomplete="current-password"></label>
    <label class="chk"><input id="remember" type="checkbox" checked> Mantener sesión en este dispositivo</label>
    <p id="authMsg" class="err"></p>
    <button id="authBtn" class="btn">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <img src="assets/logo.png" alt="" class="logo-sm">
    <h1 id="bizName">Tama Beauty</h1>
    <nav>
      <button data-tab="products" class="on">Productos</button>
      <button data-tab="orders">Entregas</button>
      <button data-tab="invoices">Facturas</button>
      <button data-tab="profile">Perfil</button>
    </nav>
  </header>

  <!-- PRODUCTOS: tabla editable (en móvil se convierte en tarjetas) -->
  <main id="tab-products">
    <div class="bar">
      <input id="search" placeholder="Buscar producto o marca…">
      <button id="addProd" class="btn">+ Producto</button>
      <button id="csvBtn" class="btn ghost">Exportar CSV</button>
    </div>
    <table>
      <thead><tr><th>Imagen<th>Producto<th>Marca<th>Precio (COP)<th>Stock<th>Notas<th></tr></thead>
      <tbody id="ptbody"></tbody>
    </table>
    <p id="pSummary" class="sum"></p>
  </main>

  <!-- ENTREGAS: calendario + lista filtrable -->
  <main id="tab-orders" hidden>
    <div class="bar">
      <button id="prev" class="btn ghost">‹</button><strong id="calTitle"></strong><button id="next" class="btn ghost">›</button>
      <select id="range">
        <option value="upcoming">Próximas</option><option value="day">Día seleccionado</option>
        <option value="week">Próximos 7 días</option><option value="month">Mes visible</option>
      </select>
      <button id="addOrder" class="btn">+ Entrega</button>
    </div>
    <div id="cal" class="cal"></div>
    <div id="olist"></div>
  </main>

  <!-- FACTURAS: módulo aparte (js/facturas.js) -->
  <main id="tab-invoices" hidden>
    <div class="sumcards" id="iCards"></div>
    <div class="bar">
      <input id="iSearch" placeholder="Buscar por cliente o N° de factura…">
      <select id="iStatus"><option value="">Todos los estados</option><option>Pendiente</option><option>Abonada</option><option>Pagada</option></select>
      <select id="iMonth"></select>
      <button id="iNew" class="btn">+ Nueva factura</button>
      <button id="iCsv" class="btn ghost">Exportar CSV</button>
    </div>
    <div id="iList"></div>
  </main>

  <!-- PERFIL + RESPALDO -->
  <main id="tab-profile" hidden>
    <form id="profForm" class="card wide">
      <img src="assets/logo.png" alt="" class="logo-big">
      <label>Emprendimiento<input id="pBiz"></label>
      <label>Teléfono<input id="pPhone"></label>
      <label>Ciudad<input id="pCity"></label>
      <label>Usuario<input id="pUser"></label>
      <label>Nueva clave (vacío = no cambiar)<input id="pPw" type="password" autocomplete="new-password"></label>
      <button class="btn">Guardar perfil</button>
    </form>
    <div class="card wide">
      <h3>Respaldo de datos</h3>
      <p>Tus datos viven solo en este navegador. Descarga un respaldo seguido.</p>
      <button id="expBtn" class="btn">Descargar respaldo (JSON)</button>
      <label class="btn ghost">Importar respaldo<input id="impFile" type="file" accept=".json" hidden></label>
      <button id="logout" class="btn ghost">Cerrar sesión</button>
    </div>
  </main>
</div>

<!-- Diálogo de entrega -->
<dialog id="dlg">
  <form id="oForm" class="dform">
    <h3>Entrega</h3>
    <label>Fecha<input id="oDate" type="date" required></label>
    <label>Cliente<input id="oClient" required></label>
    <label>Estado<select id="oState"></select></label>
    <div class="addline"><select id="oProd"></select><input id="oQty" type="number" min="1" value="1"><button type="button" id="oAdd" class="btn ghost">Agregar</button></div>
    <ul id="lines"></ul>
    <p class="sum">Total: <b id="oTotal"></b></p>
    <label>Observaciones<textarea id="oNotes" rows="2"></textarea></label>
    <div class="bar"><button class="btn">Guardar</button><button type="button" id="oCancel" class="btn ghost">Cancelar</button></div>
  </form>
</dialog>
<!-- Editor de factura -->
<dialog id="invDlg" class="big">
  <form id="invForm" class="inv-ed">
    <div class="ed-head">
      <img src="assets/logo.png" alt="" class="logo-sm">
      <div><h3 id="edBiz"></h3><small id="edSub"></small></div>
      <div class="ed-no">
        <label>Factura N°<input id="iNum" type="number" min="1" required></label>
        <label>Fecha<input id="iDate" type="date" required></label>
      </div>
    </div>
    <div class="ed-grid">
      <label>Nombre del cliente<input id="iClient" required maxlength="80" autocomplete="off" list="clientList"></label>
      <label>Teléfono / WhatsApp<input id="iPhone" type="tel" inputmode="tel" maxlength="20"></label>
      <label>Método de pago<select id="iMethod"></select></label>
    </div>
    <div>
      <div class="il il-h"><span>Producto</span><span>Cant.</span><span>Precio</span><span>Total</span><span></span></div>
      <div id="iLines"></div>
    </div>
    <button type="button" id="iAddLine" class="btn ghost">+ Agregar producto</button>
    <div class="ed-bottom">
      <label>Notas (salen en la factura)<textarea id="iNotes" rows="5" maxlength="300" placeholder="Ej: entrega el sábado, garantía, datos de pago…"></textarea></label>
      <div class="tot">
        <div><span>Subtotal</span><b id="tSub"></b></div>
        <div><span>Descuento</span><span class="grp"><input id="iDisc" type="number" min="0" step="any" placeholder="0"><select id="iDiscT"><option>%</option><option>$</option></select></span></div>
        <small class="hint" id="tDisc"></small>
        <div><span>Domicilio</span><input id="iShip" type="number" min="0" step="500" placeholder="0"></div>
        <div class="grand"><span>TOTAL</span><b id="tTotal"></b></div>
        <div><span>Abonado</span><input id="iPaid" type="number" min="0" step="500" placeholder="0"></div>
        <div><span>Saldo</span><b id="tBal"></b></div>
        <div><span>Estado</span><span class="chip" id="tState"></span></div>
        <button type="button" id="iFull" class="btn ghost sm">Marcar pago completo</button>
      </div>
    </div>
    <p id="iMsg" class="err"></p>
    <div class="bar"><button class="btn" data-view="">Guardar</button><button class="btn ghost" data-view="1">Guardar y ver</button><button type="button" id="iCancel" class="btn ghost">Cancelar</button></div>
  </form>
</dialog>
<datalist id="prodList"></datalist>
<datalist id="clientList"></datalist>

<!-- Vista previa de factura -->
<dialog id="vDlg" class="big">
  <div id="vSheet"></div>
  <div class="bar vbar">
    <button id="vPrint" class="btn">🖨 Imprimir / Guardar PDF</button>
    <button id="vWa" class="btn ghost">WhatsApp</button>
    <button id="vEdit" class="btn ghost">Editar</button>
    <button id="vClose" class="btn ghost">Cerrar</button>
  </div>
</dialog>

<!-- Zona que se imprime (solo la factura) -->
<div id="invPrint"></div>

<script src="js/app.js?v=2"></script>
<script src="js/facturas.js?v=2"></script>
</body>
</html>
